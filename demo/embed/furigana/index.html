<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="color-scheme" content="light dark"><title>Hikidashi · Japanese text tool</title><style>html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}body{display:flex;align-items:center;justify-content:center;padding:8px;box-sizing:border-box}body>*{max-height:100%}</style></head><body><script type="module">
import "../../dist/element-define.js";
const query=new URLSearchParams(location.search),element=document.createElement("hikidashi-furigana");element.setAttribute("size","medium");
for(const[name,choices]of[["size",["small","medium","large"]],["theme",["auto","light","dark"]],["lang",["en","ja"]],["format",["japanese","romaji"]],["mode",["write","read","parse"]]])if(choices.includes(query.get(name))&&element.constructor.observedAttributes.includes(name))element.setAttribute(name,query.get(name));
for(const name of["gannen","formal"])if(element.constructor.observedAttributes.includes(name)&&query.has(name)&&["","true","on","1","false","off","no","0"].includes(query.get(name).toLowerCase()))element.setAttribute(name,query.get(name));
for(const name of["text","reading","value","label"]){const value=query.get(name);if(element.constructor.observedAttributes.includes(name)&&value!==null&&value.length<=1000)element.setAttribute(name,value);}
const width=query.get("width");if(width!==null&&/^\d+$/.test(width)&&Number(width)>=100&&Number(width)<=2000)element.setAttribute("width",width);if(query.get("lang")==="ja")document.documentElement.lang="ja";
for(const type of["hikidashi-load","hikidashi-change","hikidashi-error"])element.addEventListener(type,event=>{if(parent!==window)parent.postMessage({type:event.type,detail:JSON.parse(JSON.stringify(event.detail))},"*");});document.body.append(element);
</script></body></html>
